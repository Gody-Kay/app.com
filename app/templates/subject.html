{% extends "base.html" %}
{% block content %}
<div>
    <a href="/dashboard" style="display: inline-block; margin-bottom: 1rem;">← Back to Dashboard</a>
    <h2 style="margin-bottom: 0.5rem;">Lessons</h2>
    <div id="lessonGrid" class="subject-grid">
        <p>Loading lessons...</p>
    </div>
    <div class="glass-panel" style="margin-top: 2rem; border-style: dashed;">
        <h3 style="margin-bottom: 0.5rem;">Create a New Lesson</h3>
        <p style="margin-bottom: 1rem;">Paste study material below to generate a new lesson.</p>
        <form onsubmit="createLesson(event)">
            <div class="form-group">
                <label>Lesson Title</label>
                <input type="text" name="title" required placeholder="e.g., The Mitochondria">
            </div>
            <div class="form-group">
                <label>Study Material (Raw Text)</label>
                <textarea name="raw_material" required placeholder="Paste notes, book excerpts, etc. here..." rows="5"></textarea>
            </div>
            <button type="submit" id="generateBtn">Generate Lesson</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadLessons();
    });
</script>
{% endblock %}
